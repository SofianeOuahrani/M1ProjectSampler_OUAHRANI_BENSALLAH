<div class="form-container">
  <h3>➕ Créer un nouveau Preset</h3>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="presetName">Nom du kit *</label>
      <input
        type="text"
        id="presetName"
        [(ngModel)]="presetName"
        name="presetName"
        placeholder="Ex: Mon Kit Perso"
        required
      >
    </div>

    <div class="form-group">
      <label>URLs des sons *</label>
      <p class="hint">Entrez les URLs directes des fichiers audio (MP3, WAV, OGG)</p>

      <div class="url-list">
        <div *ngFor="let url of soundUrls; let i = index; trackBy: trackByIndex" class="url-row">
          <span class="url-number">{{ i + 1 }}</span>
          <input
            type="url"
            [value]="url"
            (input)="updateUrl(i, $any($event.target).value)"
            placeholder="https://example.com/sound.mp3"
          >
          <button
            type="button"
            class="btn-remove"
            (click)="removeSoundUrl(i)"
            [disabled]="soundUrls.length <= 1"
            title="Supprimer"
          >
            ✕
          </button>
        </div>
      </div>

      <button type="button" class="btn-add" (click)="addSoundUrl()">
        + Ajouter un son
      </button>
    </div>

    <div *ngIf="error" class="error-msg">
      ⚠️ {{ error }}
    </div>

    <div class="form-actions">
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="!isValid() || isSubmitting"
      >
        {{ isSubmitting ? 'Création...' : '✓ Créer le Preset' }}
      </button>
      <button
        type="button"
        class="btn btn-secondary"
        (click)="onCancel()"
      >
        Annuler
      </button>
    </div>
  </form>
</div>
